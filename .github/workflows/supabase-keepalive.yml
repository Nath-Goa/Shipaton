# Free-tier Supabase projects pause after 7 days without API traffic, which
# would silently break Friends/Family/Duels for anyone installing the app
# later. One call a day to the no-op public.keepalive() function (see
supabase/schema.sql) keeps the project awake.
# SUPABASE_URL / SUPABASE_ANON_KEY are repo Actions secrets (the same public
# URL + anon key the app ships with).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keepalive")
          echo "HTTP $status"
          test "$status" = "200"
