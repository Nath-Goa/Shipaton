name: EAS Build (Android)

# Manual trigger only (not on every push) — this repo has more than one
# contributor, and EAS's free tier has a limited number of builds per
# month, so builds shouldn't fire on every unrelated commit. Run it from
# the Actions tab ("Run workflow"), from GitHub mobile, or ask Claude to
# trigger it.
on:
  workflow_dispatch: {}

concurrency:
  group: eas-build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Expense Tracker"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Installed directly with npm rather than via expo/expo-github-action,
      # whose own yarn-based install step was failing on this runner image.
      - name: Install eas-cli
        run: npm install --global eas-cli

      # First run creates the EAS project (under the nathgoas-team account)
      # and writes its id into app.json for this job's checkout; later runs
      # just link to that same existing project — either way this is
      # idempotent, so it's safe to run on every build rather than only once.
      - name: Link or create EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --non-interactive --account nathgoas-team

      - name: Build Android APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
