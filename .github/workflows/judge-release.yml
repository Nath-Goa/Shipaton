name: Update judge release

# Copies Markva-Judge.apk from a finished "Judge APK (Android)" run onto the
# judge-v1 release, replacing the APK judges download. No rebuild: it takes a
# minute. The run id is the number at the end of the run's URL
# (github.com/Nath-Goa/Shipaton/actions/runs/<run id>).
#
# judge-v1 is what the README's releases/latest/download link and any direct
# judge-v1 link both point at, so replacing its file keeps every link judges
# may have working.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a successful Judge APK (Android) build"
        required: true
        type: string

concurrency:
  group: judge-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the build's APK
        run: gh run download "${{ inputs.run_id }}" --name Markva-Judge --dir apk

      - name: Replace the APK on judge-v1
        run: |
          ls -lh apk/Markva-Judge.apk
          gh release upload judge-v1 apk/Markva-Judge.apk --clobber
          gh release view judge-v1 --json assets --jq '.assets[] | "\(.name) \(.size) bytes, updated \(.updatedAt)"'
