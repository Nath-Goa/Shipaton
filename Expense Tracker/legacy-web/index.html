<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <meta name="description" content="Track your expenses, see the breakdown by category, and filter by date." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a2 2 0 0 1 2 2v1" />
            <path d="M3 7.5V17a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3" />
            <path d="M21 10h-4a2 2 0 0 0 0 4h4z" />
          </svg>
        </span>
        <div class="brand-text">
          <h1>Expense Tracker</h1>
          <p>Know exactly where your money goes</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost" id="exportBtn">Export CSV</button>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <section class="stats" id="stats" aria-label="Summary"></section>

    <div class="layout">

      <aside class="sidebar">
        <section class="card">
          <div class="card-head">
            <h2 id="formTitle">Add expense</h2>
          </div>
          <form id="expenseForm" class="form" novalidate>
            <div class="field">
              <label for="desc">Description</label>
              <input id="desc" type="text" placeholder="e.g. Lunch with the team" autocomplete="off" />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="amount">Amount</label>
                <div class="input-prefix">
                  <span aria-hidden="true">$</span>
                  <input id="amount" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal" />
                </div>
              </div>
              <div class="field">
                <label for="date">Date</label>
                <input id="date" type="date" />
              </div>
            </div>
            <div class="field">
              <label for="category">Category</label>
              <select id="category"></select>
            </div>
            <p class="form-error" id="formError" role="alert" hidden></p>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submitBtn">Add expense</button>
              <button type="button" class="btn btn-ghost" id="cancelEdit" hidden>Cancel</button>
            </div>
          </form>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>Filters</h2>
            <button type="button" class="link-btn" id="resetFilters">Reset</button>
          </div>
          <div class="form">
            <div class="field">
              <label for="filterSearch">Search</label>
              <input id="filterSearch" type="search" placeholder="Search descriptions" autocomplete="off" />
            </div>
            <div class="field">
              <label for="filterCategory">Category</label>
              <select id="filterCategory"></select>
            </div>
            <div class="field">
              <span class="label">Quick range</span>
              <div class="chips" id="presets">
                <button type="button" class="chip is-active" data-preset="all">All time</button>
                <button type="button" class="chip" data-preset="month">This month</button>
                <button type="button" class="chip" data-preset="30">Last 30 days</button>
                <button type="button" class="chip" data-preset="year">This year</button>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="filterFrom">From</label>
                <input id="filterFrom" type="date" />
              </div>
              <div class="field">
                <label for="filterTo">To</label>
                <input id="filterTo" type="date" />
              </div>
            </div>
          </div>
        </section>
      </aside>

      <main class="content">
        <section class="card">
          <div class="card-head">
            <h2>Spending by category</h2>
            <span class="pill" id="periodPill">All time</span>
          </div>
          <div class="breakdown">
            <div class="chart-wrap">
              <svg id="chart" viewBox="0 0 200 200" role="img" aria-label="Pie chart of spending by category"></svg>
              <div class="chart-center" id="chartCenter">
                <span class="chart-center-label" id="chartLabel">Total</span>
                <span class="chart-center-value" id="chartValue">$0.00</span>
              </div>
            </div>
            <ul class="legend" id="legend"></ul>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>Expenses <span class="count" id="listCount">0</span></h2>
            <label class="sort">
              <span class="sr-only">Sort expenses by</span>
              <select id="sortBy">
                <option value="date-desc">Newest first</option>
                <option value="date-asc">Oldest first</option>
                <option value="amount-desc">Highest amount</option>
                <option value="amount-asc">Lowest amount</option>
              </select>
            </label>
          </div>
          <ul class="expense-list" id="expenseList"></ul>
        </section>
      </main>

    </div>
  </div>

  <div class="toast" id="toast" hidden>
    <span id="toastMsg"></span>
    <button type="button" class="link-btn" id="toastAction">Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
